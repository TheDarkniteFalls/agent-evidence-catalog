name: checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require Node.js 20 or later
        run: node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 20) process.exit(1)'
      - name: Check the synthetic catalog contract
        run: node scripts/catalog.mjs test
